  <!-- Force font-display: swap behavior for CDN-hosted SF Pro Display font -->
  <script>
    if ('fonts' in document) {
      const font = new FontFace('SF Pro Display', 'url(https://cdn.jsdelivr.net/npm/sf-font@1.0.0/SFProDisplay-Regular.woff2)', {
        display: 'swap'
      });
      font.load().then(function(loadedFont) {
        document.fonts.add(loadedFont);
      }).catch(function(e) {
        // Fallback silently
      });
    }
  </script>

  <!-- Preload the main hero image to fix the 9.5s LCP issue -->
  <link rel="preload" fetchpriority="high" as="image" href="/hero-bg.webp" type="image/webp" />

  <!-- Asynchronously load SF Font Stylesheet -->
